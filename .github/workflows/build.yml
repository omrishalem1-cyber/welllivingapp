name: Build

on:
  push:
    branches: [main, attention-trainer-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the training logic
        run: ./gradlew :trainer:test

      - name: Build the APK
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk attention-trainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: attention-trainer-apk
          path: attention-trainer.apk

      # A fixed download link that always points at the newest build.
      - name: Publish the latest APK as a release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete attention-latest --yes --cleanup-tag || true
          gh release create attention-latest attention-trainer.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "מאמן קשב · בנייה ${GITHUB_RUN_NUMBER}" \
            --notes "בנייה אוטומטית מהענף ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}."
